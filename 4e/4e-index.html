<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4e - Mes cours de maths</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap');

  body {
    font-family: 'Nunito', sans-serif;
    color: #222;
    background: #fafafa;
    max-width: 700px;
    margin: 0 auto;
    padding: 40px 30px 60px;
  }

  .back {
    display: inline-block;
    margin-bottom: 24px;
    color: #666;
    text-decoration: none;
    font-size: 14px;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 30px;
  }

  .chapitres {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .chapitre-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 10px;
    padding: 14px 18px;
    text-decoration: none;
    color: #222;
    font-size: 16px;
  }

  .chapitre-card:hover {
    border-color: #222;
    background: #f5f5f5;
  }

  .chapitre-num {
    font-weight: 700;
    margin-right: 12px;
  }

  .chapitre-disabled {
    color: #aaa;
    border-style: dashed;
  }

  h2.section { font-size: 18px; font-weight: 700; margin: 34px 0 12px; }
  .info { background: #fff; border: 1px solid #ccc; border-radius: 10px; padding: 14px 18px; font-size: 15px; line-height: 1.5; }
  .info p { margin: 0 0 6px; }
  .info ul { margin: 0; padding-left: 20px; }
  .chapitre-card .tag { font-size: 13px; color: #888; margin-left: 12px; white-space: nowrap; }
</style>
</head>
<body>

<a class='back' href='/'>&larr; Retour aux niveaux</a>
<h1>4e - Liste des chapitres</h1>

<div class="chapitres">
  <div class="chapitre-card chapitre-disabled">
    <span>Les cours de 4e arriveront ici au fil de l'année</span>
  </div>
</div>

</body>
</html>
